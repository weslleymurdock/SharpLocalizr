name: Continuous

on:
  push:
    tags: ["v*"]
  pull_request:
    types: ["opened", "synchronize", "reopened"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Integration
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Build
        run: dotnet build SharpLocalizr.slnx

  test:
    runs-on: ubuntu-latest
    name: Testing
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ github.workspace }}/global.json

      - name: Setup Report Generator
        run: dotnet tool restore --tool-manifest ${{ github.workspace }}/dotnet-tools.json

      - name: Run Tests
        id: test
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts/test-results | Out-Null
          $outputFile = Join-Path $env:GITHUB_WORKSPACE 'artifacts/test-output.txt'
          & dotnet test $env:GITHUB_WORKSPACE/tests/Localizr.UnitTests/Localizr.UnitTests.csproj `
            --configuration Release `
            --results-directory $env:GITHUB_WORKSPACE/artifacts/test-results 2>&1 | Tee-Object -FilePath $outputFile
          $exitCode = $LASTEXITCODE
          "dotnet test exit code: $exitCode" | Add-Content -Path $outputFile
          "TEST_EXIT_CODE=$exitCode" | Out-File -FilePath artifacts/test-exit-code.txt -Encoding utf8

      - name: Publish Test Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Continuous Test Results'
          path: './artifacts/test-results/*.trx'
          reporter: 'dotnet-trx'

      - name: Generate coverage report
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/coverage | Out-Null
          $coverageFiles = @(Get-ChildItem -Path artifacts/test-results -Filter 'coverage.cobertura*.xml' -Recurse -File -ErrorAction SilentlyContinue)
          if ($coverageFiles.Count -gt 0) {
            dotnet tool run reportgenerator -- -reports:"artifacts/test-results/**/coverage.cobertura*.xml" -targetdir:"artifacts/coverage" -reporttypes:"MarkdownSummary;Cobertura"
          } else {
            "# Coverage report unavailable`n`nCoverlet did not produce a coverage XML file." | Out-File artifacts/coverage/Summary.md -Encoding utf8
          }

      - name: Enforce 80 percent line and branch coverage
        if: always()
        shell: pwsh
        run: |
          $coverageFiles = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE/artifacts/test-results" -Filter 'coverage.cobertura*.xml' -Recurse -File -ErrorAction SilentlyContinue)

          if ($coverageFiles.Count -eq 0) {
            "## Coverage gate`n`nNo Coverlet XML was found under the test-results directory." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Error "Coverage data was not produced."
            return
          }

          $coverageFile = $coverageFiles | Select-Object -First 1
          [xml]$coverage = Get-Content $coverageFile.FullName
          $lineRate = [double]$coverage.coverage.'line-rate' * 100
          $branchRate = [double]$coverage.coverage.'branch-rate' * 100

          @"
          ## Coverage gate
          | Metric | Result | Minimum | Status |
          | --- | ---: | ---: | ---: |
          | Line coverage | $([math]::Round($lineRate, 2))% | 80% | $(if ($lineRate -ge 80) { '✅' } else { '❌' }) |
          | Branch coverage | $([math]::Round($branchRate, 2))% | 80% | $(if ($branchRate -ge 80) { '✅' } else { '❌' }) |
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          "LINE_COVERAGE=$([math]::Round($lineRate, 2))" | Out-File artifacts/line-rate.txt -Encoding utf8
          "BRANCH_COVERAGE=$([math]::Round($branchRate, 2))" | Out-File artifacts/branch-rate.txt -Encoding utf8

          if ($lineRate -lt 80 -or $branchRate -lt 80) {
            Write-Error "Coverage gate failed. Line coverage: $([math]::Round($lineRate, 2))%; Branch coverage: $([math]::Round($branchRate, 2))%; minimum: 80%."
          }

      - name: Append test execution report
        if: always()
        shell: pwsh
        run: if (Test-Path artifacts/coverage/Summary.md) { Get-Content artifacts/coverage/Summary.md | Add-Content $env:GITHUB_STEP_SUMMARY } else { Add-Content $env:GITHUB_STEP_SUMMARY 'Coverage report was not generated.' }

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Continuous-Testing-Reports
          path: artifacts/
          if-no-files-found: warn

      - name: Fail if tests failed
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/test-exit-code.txt) {
            $exitCode = [int](Get-Content artifacts/test-exit-code.txt -Raw).Replace('TEST_EXIT_CODE=', '').Trim()
            if ($exitCode -ne 0) { Write-Error "dotnet test failed with exit code $exitCode." }
          }
